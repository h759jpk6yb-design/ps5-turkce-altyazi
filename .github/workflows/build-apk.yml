
name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle wrapper bul
        run: |
          GRADLEW=$(find extracted -name gradlew -type f -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadi!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$GRADLEW"

      - name: APK derle
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: APK dosyasini sun
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
