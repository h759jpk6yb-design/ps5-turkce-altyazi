
name: ZIP Arsivini Cikar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini bul ve cikar
        run: |
          ZIP_FILE=$(find . -type f -iname '*.zip' ! -path './.git/*' -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP dosyasi bulunamadi!"
            exit 1
          fi

          echo "Bulunan dosya: $ZIP_FILE"
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Dosyalari depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extracted/
          git commit -m "ZIP arsivi cikarildi" || echo "Yeni dosya yok"
          git push
